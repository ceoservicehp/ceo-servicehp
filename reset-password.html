<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Password Baru - CEO Part & Service</title><link rel="stylesheet" href="css/login.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script></head><body><div class="login-wrapper"><div class="login-card"><div class="logo-area"><img src="images/logo.png" class="logo"><span class="eyebrow">KEAMANAN AKUN</span><h2>Buat Password Baru</h2><p class="subtitle">Gunakan password baru minimal 8 karakter.</p></div><form id="passwordForm" class="auth-form"><div class="input-group"><i class="fa-solid fa-lock"></i><input type="password" id="newPassword" placeholder="Password baru" minlength="8" autocomplete="new-password" required></div><div class="input-group"><i class="fa-solid fa-shield-halved"></i><input type="password" id="confirmPassword" placeholder="Konfirmasi password" minlength="8" autocomplete="new-password" required></div><button type="submit" class="login-btn"><i class="fa-solid fa-floppy-disk"></i>Simpan Password Baru</button></form><div id="alertBox" class="alert-box" style="display:none"></div><div class="switch-links single"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Kembali ke Login</a></div></div></div><script src="js/reset-password.js"></script></body></html>
