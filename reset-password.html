<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password — CEO Part & Service</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="css/password.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script defer src="js/reset-password.js"></script></head><body><main class="auth-shell"><section class="auth-card"><div class="brand-mark"><img src="images/logo.png" alt="CEO"><div><b>CEO PART & SERVICE</b><span>Cellular Engineering Officer</span></div></div><div class="auth-icon"><i class="fa-solid fa-shield-halved"></i></div><h1>Buat Password Baru</h1><p class="lead">Masukkan password baru untuk akun CEO Part & Service.</p><form id="resetForm"><label>Password baru</label><div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" id="password" minlength="8" required autocomplete="new-password"><button class="peek" type="button" data-target="password"><i class="fa-solid fa-eye"></i></button></div><label>Ulangi password</label><div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" id="confirmPassword" minlength="8" required autocomplete="new-password"><button class="peek" type="button" data-target="confirmPassword"><i class="fa-solid fa-eye"></i></button></div><button id="submitBtn" type="submit"><i class="fa-solid fa-floppy-disk"></i> Simpan Password Baru</button></form><div id="message" class="message" hidden></div><a class="back-link" href="login.html"><i class="fa-solid fa-arrow-left"></i> Kembali ke Login</a></section></main></body></html>
